<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lilies of God Church | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #0f3b3b;
            --primary-light: #1a5a5a;
            --primary-dark: #082525;
            --accent: #d4af37;
            --accent-light: #f3e6b5;
            --gold: #e8c84c;
            --cream: #fcf9f2;
            --white: #ffffff;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 20px;
            --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: #1e1e1e;
            line-height: 1.6;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 36px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: var(--accent);
            color: var(--primary-dark);
        }
        .btn-primary:hover {
            background: var(--gold);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.4);
        }
        .btn-outline {
            background: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: var(--white);
            color: var(--primary);
            transform: translateY(-4px);
        }
        .btn-secondary {
            background: var(--primary);
            color: var(--white);
        }
        .btn-secondary:hover {
            background: var(--primary-light);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(15, 59, 59, 0.3);
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 12px 0;
            background: rgba(15, 59, 59, 0.92);
            backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }
        header.scrolled {
            background: rgba(8, 37, 37, 0.98);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-dark);
            border: 2px solid var(--gold);
        }
        .logo-text {
            color: var(--white);
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .logo-text span {
            color: var(--accent);
        }
        .logo-text small {
            display: block;
            font-weight: 400;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
        }
        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-links a.active {
            background: var(--accent);
            color: var(--primary-dark);
        }
        .nav-cta {
            background: var(--accent) !important;
            color: var(--primary-dark) !important;
            font-weight: 700 !important;
        }
        .nav-cta:hover {
            background: var(--gold) !important;
            transform: scale(1.05);
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 28px;
            height: 3px;
            background: var(--white);
            border-radius: 4px;
            transition: var(--transition);
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 6px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -6px);
        }
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 140px 0 80px;
            background: linear-gradient(145deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
            color: var(--white);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -15%;
            width: 60%;
            height: 160%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero::after {
            content: '⚜️';
            position: absolute;
            bottom: 20px;
            right: 40px;
            font-size: 14rem;
            opacity: 0.04;
            pointer-events: none;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .hero-content h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }
        .hero-content h1 .highlight {
            color: var(--accent);
            position: relative;
        }
        .hero-content h1 .highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--accent);
            opacity: 0.4;
            border-radius: 4px;
        }
        .hero-content .subtitle {
            font-size: 1.2rem;
            opacity: 0.85;
            max-width: 500px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .hero-content .location-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            margin-bottom: 24px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hero-content .location-tag i {
            color: var(--accent);
            margin-right: 8px;
        }
        .hero-content p {
            font-size: 1.05rem;
            opacity: 0.75;
            max-width: 460px;
            margin-bottom: 32px;
            line-height: 1.8;
        }
        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius);
            padding: 40px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }
        .hero-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
        }
        .hero-card .card-icon {
            font-size: 2.4rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .hero-card h3 {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }
        .hero-card .service-time {
            font-size: 0.95rem;
            opacity: 0.8;
            margin-bottom: 16px;
        }
        .countdown-box {
            display: flex;
            gap: 16px;
            margin: 16px 0 20px;
        }
        .countdown-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            min-width: 60px;
            text-align: center;
        }
        .countdown-item span {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.2;
        }
        .countdown-item small {
            font-size: 0.6rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }
        .hero-card .btn {
            width: 100%;
            justify-content: center;
        }
